version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: brightloop-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./brightloop.db
      - SECRET_KEY=production-secret-change-this-value
      - ACCESS_TOKEN_MINUTES=720
      - FRONTEND_ORIGIN=http://localhost:5173
    volumes:
      - ./backend/brightloop.db:/app/brightloop.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: brightloop-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

